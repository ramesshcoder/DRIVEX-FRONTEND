
<div class="app-input">
    @if(label){
  <label
    [for]="inputId"
    class="app-input__label">
    {{ label }}
      <span *ngIf="required" class="app-input__required">*</span>

  </label>
    }
  <input
    pInputText
    [id]="inputId"
    [type]="type"
    [formControl]="control"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [invalid]="control.invalid && control.touched"
    class="app-input__field"
  />
@if(control.invalid && control.touched){
  <small
    class="app-input__error">
    {{ errorMessage }}
  </small>}
</div>
