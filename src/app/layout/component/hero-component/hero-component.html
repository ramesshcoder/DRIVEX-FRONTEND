<!-- hero.component.html -->
<section class="hero" [style.--hero-image]="'url(' + image + ')'">
  <div class="hero__container">
    <div class="hero__content">
      <span class="hero__eyebrow">{{ eyebrow }}</span>

      <h1 class="hero__title">
        {{ title }}
        <span class="hero__highlight">{{ highlight }}</span>
      </h1>

      <p class="hero__description">{{ description }}</p>

      <div class="hero__actions">
        <app-button-component
          label="Explore Cars"
          icon="pi pi-arrow-right"
          [iconPos]="Position.Right"
          routerLink="cars"
          styleClass="hero__btn hero__btn--primary">
        </app-button-component>

        <app-button-component
          label="Learn More"
          [routerLink]=""
          styleClass="hero__btn hero__btn--ghost">
        </app-button-component>
      </div>
    </div>
  </div>
</section>
