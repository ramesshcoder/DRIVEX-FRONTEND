
<div class="flex align-items-center justify-content-center min-h-screen surface-ground p-3">

  <div class="surface-card border-round-2xl shadow-3 w-full md:w-6 lg:w-5 xl:w-4 p-4 md:p-5">

    <!-- Header -->
    <div class="text-center mb-5">

      <h1 class="text-3xl font-bold text-primary mb-2">
        DriveX
      </h1>

      <h2 class="text-2xl font-semibold text-900 mb-2">
        Welcome Back
      </h2>

      <p class="text-600 m-0">
        Sign in to continue your journey.
      </p>

    </div>

    <!-- Login Form -->
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >

      <!-- Email -->
      <div class="field mb-4">

        <label
          for="email"
          class="block font-medium mb-2"
        >
          Email Address
        </label>

        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          placeholder="example@email.com"
          autocomplete="email"
          class="w-full"
        />


      </div>

      <!-- Password -->
      <div class="field mb-3">

        <label
          for="password"
          class="block font-medium mb-2"
        >
          Password
        </label>

        <p-password
          inputId="password"
          formControlName="password"
          placeholder="Enter your password"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password"
        />

   

      </div>

      <!-- Forgot Password -->
      <div class="flex justify-content-end mb-4">

        <a
          routerLink="/forgot-password"
          class="text-primary font-medium no-underline text-sm"
        >
          Forgot Password?
        </a>

      </div>

      <!-- Submit -->
      <app-button-component
        label="Sign In"
        icon="pi pi-sign-in"
        styleClass="w-full"
      />

    </form>

    <!-- Signup Link -->
    <div class="text-center mt-4">

      <span class="text-600">
        Don't have an account?
      </span>

      <a
        routerLink="/signup"
        class="text-primary font-semibold no-underline ml-1"
      >
        Create Account
      </a>

    </div>

    <!-- Footer -->
    <div class="text-center mt-5">

      <small class="text-500">
        Smarter Rides. Better Journeys.
      </small>

    </div>

  </div>

</div>
